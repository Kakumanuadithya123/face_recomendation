databases:
  - name: majorprojectdb
    plan: free
    databaseName: majorproject
    user: majorproject

services:
  - type: web
    plan: free
    name: majorproject
    runtime: python3.10
    buildCommand: "./build.sh"
    startCommand: "gunicorn --timeout 120 --workers 3 -k uvicorn.workers.UvicornWorker majorproject.asgi:application"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: majorprojectdb
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: WEB_CONCURRENCY
        value: 2
      - key: GUNICORN_CMD_ARGS
        value: "--timeout 120 --workers 3"
